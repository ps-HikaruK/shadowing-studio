<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shadowing" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Shadowing Studio</title>
    <!-- 2026-09-04 feedback: if View Source still shows /assets/index-*.js, a leftover Service Worker is serving the Sep 2 build -->
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root"></div>
    <script>
      (() => {
        const local = location.hostname === "localhost" || location.hostname === "127.0.0.1";
        if (!local || !("serviceWorker" in navigator)) return;
        navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));
        if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k)));
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
